<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ps-lang compiler</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #0b0f19; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 15px; text-align: center; background: #161f32; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid #233554; }
        .container { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        textarea { flex: 1; background: #1e293b; color: #38bdf8; border: 1px solid #334155; border-radius: 12px; padding: 15px; font-size: 18px; font-family: monospace; resize: none; }
        textarea:focus { outline: none; border-color: #38bdf8; }
        button { background: #0284c7; color: white; border: none; padding: 18px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        button:active { background: #0369a1; }
        .output-box { height: 120px; background: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; font-family: monospace; overflow-y: auto; color: #10b981; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="header"> 新言語「ps」オンライン実行環境</div>
    <div class="container">
        <textarea id="code" placeholder='ps "Hello, World"' autofocus></textarea>
        <button onclick="runCode()"> 変換 ＆ 爆速C++実行</button>
        <div class="output-box" id="output">【実行結果がここに表示されます】</div>
    </div>

    <script>
        async function runCode() {
            const code = document.getElementById('code').value;
            const outputBox = document.getElementById('output');
            outputBox.innerText = 'AIがC++に翻訳＆コンパイル中...';
            
            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                const data = await response.json();
                if (data.success) {
                    outputBox.innerHTML = `<span style="color: #60a5fa;">[C++コード]\n${data.cpp}</span>\n\n<span style="color: #10b981;">[実行結果]\n${data.output}</span>`;
                } else {
                    outputBox.innerText = 'エラー:\n' + (data.error || '不明なエラー');
                }
            } catch (err) {
                outputBox.innerText = '通信エラーが発生しました。';
            }
        }
    </script>
</body>
</html>
